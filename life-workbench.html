// ─── STATS ───
function renderLibStats(mod) {
  var items = state.library.items || [];
  var now = new Date();
  var cy = now.getFullYear();

  // Type breakdown
  var typeStats = {};
  LIB_TYPES.forEach(function(t) {
    typeStats[t.id] = { icon:t.icon, label:t.label, total:0, wish:0, doing:0, done:0, rated:[], excerpts:0 };
  });
  items.forEach(function(item) {
    if (typeStats[item.type]) {
      var s = typeStats[item.type];
      s.total++;
      if (s[item.status] !== undefined) s[item.status]++;
      if (item.rating) s.rated.push(item.rating);
      s.excerpts += (item.excerpts || []).length;
    }
  });

  // Overall stats
  var totalItems = items.length;
  var totalDone = items.filter(function(i) { return i.status === 'done'; }).length;
  var totalDoing = items.filter(function(i) { return i.status === 'doing'; }).length;
  var totalWish = items.filter(function(i) { return i.status === 'wish'; }).length;
  var totalRated = items.filter(function(i) { return i.rating > 0; });
  var avgRating = totalRated.length > 0 ? (totalRated.reduce(function(a, i) { return a + i.rating; }, 0) / totalRated.length).toFixed(1) : '—';
  var totalExcerpts = items.reduce(function(a, i) { return a + (i.excerpts || []).length; }, 0);

  // This year stats
  var yearItems = items.filter(function(i) {
    return (i.endDate && i.endDate.startsWith(cy)) || (i.startDate && i.startDate.startsWith(cy));
  });

  // Rating distribution
  var ratingDist = [0, 0, 0, 0, 0]; // 1-5 stars
  totalRated.forEach(function(i) { if (i.rating >= 1 && i.rating <= 5) ratingDist[i.rating - 1]++; });
  var maxRating = Math.max.apply(null, ratingDist.concat([1]));

  // Monthly activity (this year)
  var monthActivity = [];
  for (var m = 0; m < 12; m++) {
    var mStr = cy + '-' + String(m + 1).padStart(2, '0');
    var cnt = items.filter(function(i) {
      return (i.endDate && i.endDate.startsWith(mStr)) || (i.startDate && i.startDate.startsWith(mStr));
    }).length;
    monthActivity.push({ month: m + 1, count: cnt });
  }
  var maxMonth = Math.max.apply(null, monthActivity.map(function(m) { return m.count; }).concat([1]));

  // Top rated items
  var topRated = items.filter(function(i) { return i.rating > 0; }).sort(function(a, b) { return b.rating - a.rating; }).slice(0, 5);

  // Tags distribution
  var tagCounts = {};
  items.forEach(function(i) {
    (i.tags || []).forEach(function(t) {
      tagCounts[t] = (tagCounts[t] || 0) + 1;
    });
  });
  var sortedTags = Object.keys(tagCounts).map(function(t) { return { tag: t, count: tagCounts[t] }; }).sort(function(a, b) { return b.count - a.count; }).slice(0, 8);
  var maxTagCount = sortedTags.length > 0 ? sortedTags[0].count : 1;

  // Type bar chart
  var maxTypeTotal = Math.max.apply(null, Object.values(typeStats).map(function(s) { return s.total; }).concat([1]));
  var typeBarsHtml = LIB_TYPES.map(function(t) {
    var s = typeStats[t.id];
    var pct = Math.round(s.total / maxTypeTotal * 100);
    var donePct = s.total > 0 ? Math.round(s.done / s.total * 100) : 0;
    return '<div class="ls-cat-row">'
      + '<span class="ls-cat-icon">' + s.icon + '</span>'
      + '<span class="ls-cat-label">' + s.label + '</span>'
      + '<div class="ls-cat-bar"><div class="ls-cat-fill" style="width:' + pct + '%;"></div><div class="ls-cat-done" style="width:' + (pct * donePct / 100) + '%;"></div></div>'
      + '<span class="ls-cat-num">' + s.done + '/' + s.total + '</span>'
      + '</div>';
  }).join('');

  // Rating distribution bars
  var ratingBarsHtml = ratingDist.map(function(cnt, idx) {
    var h = Math.round(cnt / maxRating * 100);
    return '<div class="ls-rating-bar">'
      + '<div class="ls-rating-fill" style="height:' + h + '%;"></div>'
      + '<div class="ls-rating-label">' + (idx + 1) + '⭐</div>'
      + '<div class="ls-rating-count">' + cnt + '</div>'
      + '</div>';
  }).join('');

  // Monthly activity bars
  var monthBarsHtml = monthActivity.map(function(m) {
    var h = Math.round(m.count / maxMonth * 100);
    return '<div class="ls-month-bar" title="' + m.month + '月: ' + m.count + '项">'
      + '<div class="ls-month-fill" style="height:' + h + '%;"></div>'
      + '<div class="ls-month-label">' + m.month + '</div>'
      + '</div>';
  }).join('');

  // Tag cloud
  var tagCloudHtml = sortedTags.length === 0 ? '<div class="empty-state">暂无标签</div>' :
    sortedTags.map(function(t) {
      var size = 12 + Math.round(t.count / maxTagCount * 8);
      return '<span class="ls-tag-chip" style="font-size:' + size + 'px;" onclick="setLibF(\'tag\',\'' + escHtml(t.tag) + '\');">' + escHtml(t.tag) + ' <span class="ls-tag-count">' + t.count + '</span></span>';
    }).join('');

  // Top rated list
  var topRatedHtml = topRated.length === 0 ? '<div class="empty-state">暂无评分记录</div>' :
    topRated.map(function(item) {
      var ti = LIB_TYPES.find(function(t) { return t.id === item.type; }) || { icon: '📌' };
      return '<div class="card card-row" onclick="openLibDetail(\'' + item.id + '\')">'
        + '<span style="font-size:18px;">' + ti.icon + '</span>'
        + '<span class="card-content"><strong>' + escHtml(item.title) + '</strong>' + (item.subtitle ? '<div style="font-size:12px;color:var(--muted);">' + escHtml(item.subtitle) + '</div>' : '') + '</span>'
        + '<span style="font-size:12px;">' + '⭐'.repeat(item.rating) + '</span>'
        + '</div>';
    }).join('');

  return '<div class="page active">'
    + '<div class="module-title">'
    +   mod.icon + ' <span class="editable-title" ondblclick="editModule(\'library\')">' + mod.name + '</span>'
    +   '<button class="edit-icon-btn" onclick="editModule(\'library\')" title="编辑">✏️</button>'
    +   '<span style="margin-left:auto;display:flex;gap:6px;">'
    +     '<button class="btn-sm" onclick="libView=\'list\';renderPage(\'library\');">📋 列表</button>'
    +     '<button class="btn-sm" onclick="libView=\'calendar\';libCalendarMonth=null;renderPage(\'library\');">📅 月历</button>'
    +   '</span>'
    + '</div>'
    // Overview card
    + '<div class="ls-overview-card">'
    +   '<div class="ls-overview-title">📊 书影音统计 · ' + cy + '年</div>'
    +   '<div class="ls-overview-grid">'
    +     '<div class="ls-stat-item"><div class="ls-stat-num">' + totalItems + '</div><div class="ls-stat-lbl">总收录</div></div>'
    +     '<div class="ls-stat-item"><div class="ls-stat-num">' + totalDone + '</div><div class="ls-stat-lbl">已看完</div></div>'
    +     '<div class="ls-stat-item"><div class="ls-stat-num">' + totalDoing + '</div><div class="ls-stat-lbl">在看</div></div>'
    +     '<div class="ls-stat-item"><div class="ls-stat-num">' + totalWish + '</div><div class="ls-stat-lbl">想看</div></div>'
    +     '<div class="ls-stat-item"><div class="ls-stat-num">' + avgRating + '</div><div class="ls-stat-lbl">平均评分</div></div>'
    +     '<div class="ls-stat-item"><div class="ls-stat-num">' + totalExcerpts + '</div><div class="ls-stat-lbl">摘录数</div></div>'
    +   '</div>'
    + '</div>'
    // Type breakdown
    + '<div class="ls-section"><div class="ls-section-title">📚 类型分布与完成率</div>' + typeBarsHtml + '</div>'
    // Rating distribution
    + '<div class="ls-section"><div class="ls-section-title">⭐ 评分分布</div>'
    +   '<div class="ls-rating-chart">' + ratingBarsHtml + '</div>'
    + '</div>'
    // Monthly activity
    + '<div class="ls-section"><div class="ls-section-title">📅 ' + cy + '年月度活动</div>'
    +   '<div class="ls-month-chart">' + monthBarsHtml + '</div>'
    + '</div>'
    // Tag cloud
    + '<div class="ls-section"><div class="ls-section-title">🏷️ 热门标签</div>'
    +   '<div class="ls-tag-cloud">' + tagCloudHtml + '</div>'
    + '</div>'
    // Top rated
    + '<div class="ls-section"><div class="ls-section-title">🏆 高分推荐</div>' + topRatedHtml + '</div>'
    + '</div>';
}

// ─── CALENDAR ───
function renderLibCalendar(mod) {
  var items = state.library.items || [];
  var now = new Date();
  if (!libCalendarMonth) libCalendarMonth = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  var parts = libCalendarMonth.split('-'), cy = +parts[0], cm = +parts[1];
  var firstDay = new Date(cy, cm-1, 1);
  var daysInMonth = new Date(cy, cm, 0).getDate();
  var startDow = firstDay.getDay();
  // date map for calendar dots
  var dateMap = {};
  for (var d=1; d<=daysInMonth; d++) {
    var ds = cy+'-'+String(cm).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    dateMap[ds] = [];
  }
  items.forEach(function(item) {
    for (var d=1; d<=daysInMonth; d++) {
      var ds = cy+'-'+String(cm).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      if (item.startDate === ds || item.endDate === ds) dateMap[ds].push(item.type);
      (item.excerpts||[]).forEach(function(e) { if (e.date === ds) dateMap[ds].push(item.type); });
    }
  });
  // monthly items (started/ended/with excerpts in this month)
  var monthlyItems = items.filter(function(item) {
    if ((item.startDate||'').startsWith(libCalendarMonth)) return true;
    if ((item.endDate||'').startsWith(libCalendarMonth)) return true;
    if ((item.excerpts||[]).some(function(e){return (e.date||'').startsWith(libCalendarMonth);})) return true;
    return false;
  });
  var grouped = {};
  LIB_TYPES.forEach(function(t) { grouped[t.id] = {icon:t.icon, label:t.label, color:'var(--cal-'+t.id+')', items:[]}; });
  monthlyItems.forEach(function(item) { if (grouped[item.type]) grouped[item.type].items.push(item); });
  var totalCount = monthlyItems.length;
  var typeCount = Object.values(grouped).filter(function(g){return g.items.length>0;}).length;
  // calendar cells
  var cells = '';
  for (var i=0; i<startDow; i++) cells += '<div class="cal-cell cal-empty"></div>';
  for (var d=1; d<=daysInMonth; d++) {
    var ds = cy+'-'+String(cm).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var dayItems = dateMap[ds] || [];
    var isToday = ds === today();
    var dotsHtml = '';
    if (dayItems.length > 0) {
      var uniqueTypes = [];
      dayItems.forEach(function(t){ if (uniqueTypes.indexOf(t)===-1) uniqueTypes.push(t); });
      dotsHtml = '<div class="cal-dots">'+uniqueTypes.map(function(t){return '<span class="cal-dot cal-dot-'+t+'"></span>';}).join('')+'</div>';
    }
    cells += '<div class="cal-cell'+(isToday?' cal-today':'')+(dayItems.length?' cal-has':'')+'"><span class="cal-day-num">'+d+'</span>'+dotsHtml+'</div>';
  }
  // rating symbol (yellow heart style like xhs)
  function ratingSym(n){ return n>0 ? '<span class="rate-hearts">'+Array(n+1).join('💛')+'</span>' : ''; }
  return `
    <div class="page active lib-report">
      <div class="module-title">
        ${mod.icon} <span class="editable-title" ondblclick="editModule('library')">${mod.name}</span>
        <span style="margin-left:auto;display:flex;gap:6px;">
          <button class="btn-sm" onclick="libView='list';renderPage('library');">📋 列表</button>
        </span>
      </div>

      <div class="report-cover">
        <div class="report-cover-month">${cm}<span class="report-cover-unit">月</span></div>
        <div class="report-cover-title">书影音月报</div>
        <div class="report-cover-sub">${cy} · ${monthlyItems.length>0?'共记录 '+totalCount+' 项':'暂无记录'}</div>
        <div class="report-cover-deco">✦ ✦ ✦</div>
      </div>

      <div class="report-stats">
        ${LIB_TYPES.map(function(t){
          var cnt = grouped[t.id].items.length;
          return '<div class="stat-pill'+(cnt>0?' has':'')+'"><span class="stat-pill-icon">'+t.icon+'</span><span class="stat-pill-num">'+cnt+'</span><span class="stat-pill-lbl">'+t.label+'</span></div>';
        }).join('')}
      </div>

      <div class="cal-nav">
        <button class="btn-sm" onclick="changeCalMonth(-1)">◀ 上月</button>
        <span style="font-weight:600;font-size:15px;">${cy}年${cm}月 日历</span>
        <button class="btn-sm" onclick="changeCalMonth(1)">下月 ▶</button>
      </div>
      <div class="cal-grid-mini">
        ${['日','一','二','三','四','五','六'].map(function(d){return '<div class="cal-weekday">'+d+'</div>';}).join('')}
        ${cells}
      </div>
      <div class="cal-legend">
        ${LIB_TYPES.map(function(t){return '<span class="cal-legend-item"><span class="cal-dot cal-dot-'+t.id+'"></span>'+t.label+'</span>';}).join('')}
      </div>

      <div class="report-divider"><span>月度盘点</span></div>

      ${monthlyItems.length===0 ? '<div class="empty-state">本月还没有记录，去添加一些吧~</div>' :
        Object.values(grouped).filter(function(g){return g.items.length>0;}).map(function(g){
          return '<div class="report-section report-section-'+g.items[0].type+'">'+
            '<div class="report-section-title"><span class="rs-icon">'+g.icon+'</span><span class="rs-label">'+g.label+'</span><span class="rs-count">'+g.items.length+'</span></div>'+
            '<div class="report-section-body">'+
              g.items.map(function(item){
                var hearts = ratingSym(item.rating||0);
                var dateStr = '';
                if (item.startDate && item.endDate && item.startDate!==item.endDate) dateStr = item.startDate.slice(5)+' → '+item.endDate.slice(5);
                else if (item.startDate) dateStr = item.startDate.slice(5);
                else if (item.endDate) dateStr = item.endDate.slice(5);
                var excerptCount = (item.excerpts||[]).length;
                return '<div class="report-item" onclick="openLibDetail(\''+item.id+'\')">'+
                  '<div class="report-item-main">'+
                    '<span class="report-item-title">'+escHtml(item.title)+'</span>'+
                    (item.subtitle?'<span class="report-item-sub">'+escHtml(item.subtitle)+'</span>':'')+
                  '</div>'+
                  (hearts?'<div class="report-item-rate">'+hearts+'</div>':'')+
                  '<div class="report-item-meta">'+
                    (dateStr?'<span class="ri-date">📅 '+dateStr+'</span>':'')+
                    (item.progress>0?'<span class="ri-prog">📊 '+item.progress+'%</span>':'')+
                    (excerptCount>0?'<span class="ri-ex">📝 '+excerptCount+'</span>':'')+
                    '<span class="ri-status">'+({wish:'想看',doing:'在看',done:'已看'}[item.status]||'')+'</span>'+
                  '</div>'+
                  (item.note?'<div class="report-item-note">💬 '+escHtml(item.note)+'</div>':'')+
                '</div>';
              }).join('')+
            '</div>'+
          '</div>';
        }).join('')
      }

      <div class="report-footer">
        <div class="report-footer-line"></div>
        <div class="report-footer-text">${cy}.${String(cm).padStart(2,'0')} · 人生工作台图书馆</div>
      </div>
    </div>`;
}
function changeCalMonth(delta) {
  var parts = libCalendarMonth.split('-'), y = +parts[0], m = +parts[1];
  m += delta;
  if (m < 1) { m = 12; y--; }
  if (m > 12) { m = 1; y++; }
  libCalendarMonth = y+'-'+String(m).padStart(2,'0');
  renderPage('library');
}

// 6. MEDITATE (冥想室)

var medTimerDuration = 0;   // selected duration in seconds
var medTimerRemain = 0;     // remaining seconds
var medTimerRunning = false;
var medTimerInterval = null;

function renderMeditate() {
  // Meditation timer section
  var presets = [3, 5, 10, 15, 20, 30];
  var presetHtml = presets.map(function(m) {
    return '<button class="med-preset'+(medTimerDuration===m*60?' active':'')+'" onclick="setMedPreset('+m+')">'+m+'分</button>';
  }).join('');

  var displayMin = Math.floor(medTimerRemain / 60);
  var displaySec = medTimerRemain % 60;
  var timeStr = String(displayMin).padStart(2,'0') + ':' + String(displaySec).padStart(2,'0');
  var dashOffset = medTimerDuration > 0 ? 283 * (1 - medTimerRemain / medTimerDuration) : 283;

  var timerHtml = '<div class="section-title">🧘 冥想计时器</div>'
    + '<div class="med-timer-wrap">'
    +   '<div class="med-timer-circle">'
    +     '<svg class="med-timer-svg" viewBox="0 0 100 100">'
    +       '<circle cx="50" cy="50" r="45" class="med-timer-bg"/>'
    +       '<circle cx="50" cy="50" r="45" class="med-timer-fg" style="stroke-dashoffset:'+dashOffset+';"/>'
    +     '</svg>'
    +     '<div class="med-timer-display">'+timeStr+'</div>'
    +   '</div>'
    +   '<div class="med-preset-row">'+presetHtml+'</div>'
    +   '<div class="med-timer-controls">'
    +     '<button class="btn-sm primary" onclick="medTimerToggle()">'+(medTimerRunning?'⏸ 暂停':'▶ 开始')+'</button>'
    +     '<button class="btn-sm" onclick="medTimerReset()">↻ 重置</button>'
    +   '</div>'
    + '</div>';

  // Recent sessions
  var sessions = (state.meditate.sessions || []).slice(-10).reverse();
  var totalSessions = (state.meditate.sessions || []).length;
  var totalMins = (state.meditate.sessions || []).reduce(function(a, s) { return a + (s.duration || 0); }, 0);
  var sessionsHtml = '<div class="section-title">📊 冥想统计</div>'
    + '<div class="med-stats-row">'
    +   '<div class="med-stat-item"><div class="med-stat-num">'+totalSessions+'</div><div class="med-stat-lbl">总次数</div></div>'
    +   '<div class="med-stat-item"><div class="med-stat-num">'+totalMins+'</div><div class="med-stat-lbl">总分钟</div></div>'
    +   '<div class="med-stat-item"><div class="med-stat-num">'+(totalSessions>0?Math.round(totalMins/totalSessions):0)+'</div><div class="med-stat-lbl">平均分钟</div></div>'
    + '</div>';
  if (sessions.length > 0) {
    sessionsHtml += '<div class="med-sessions-list">'
      + sessions.map(function(s) {
          return '<div class="card card-row" style="padding:6px 10px;">'
            + '<span style="font-size:16px;">🧘</span>'
            + '<span class="card-content"><span style="font-size:12px;color:var(--muted);">'+s.date+'</span> · '+s.duration+'分钟'
            + (s.note ? '<br><span style="font-size:12px;color:var(--muted);">'+escHtml(s.note)+'</span>' : '')
            + '</span>'
            + '<button class="btn-sm danger" style="font-size:10px;padding:2px 6px;" onclick="deleteMedSession(\''+s.id+'\')">删</button>'
            + '</div>';
        }).join('')
      + '</div>';
  }

  return timerHtml + sessionsHtml;
}

function renderWisdomCards() {
  if (!state.soul) state.soul = {};
  if (!state.soul.wisdomCards) initWisdomCards();
  var cards = state.soul.wisdomCards || [];
  var activeCards = cards.filter(function(c) { return !c.archived; });
  var archivedCards = cards.filter(function(c) { return c.archived; });
  var showCards = wisdomViewMode === 'archived' ? archivedCards : activeCards;

  var subToggle = '<div class="wisdom-sub-toggle">'
    + '<span class="ws-btn'+(wisdomViewMode==='active'?' active':'')+'" onclick="setWisdomViewMode(\'active\')">💡 在用 ('+activeCards.length+')</span>'
    + '<span class="ws-btn'+(wisdomViewMode==='archived'?' active':'')+'" onclick="setWisdomViewMode(\'archived\')">📦 存档 ('+archivedCards.length+')</span>'
    + '</div>';

  var addForm = '';
  if (wisdomViewMode === 'active') {
    addForm = '<div class="wisdom-add-form">'
      + '<div class="form-row" style="margin-bottom:6px;">'
      +   '<select class="input-field" id="wisdomAddCat" style="flex:0.5;">'
      +   WISDOM_CATS.map(function(c) { return '<option value="'+c+'">'+(WISDOM_CAT_ICONS[c]||'')+' '+c+'</option>'; }).join('')
      +   '</select>'
      +   '<input class="input-field" id="wisdomAddMethod" placeholder="方法名称" style="flex:1;">'
      +   '<button class="btn-sm primary" onclick="addWisdomCard()">+ 新增</button>'
      +   '</div>'
      +   '<input class="input-field" id="wisdomAddScene" placeholder="场景说明（怎么做）" style="display:block;width:100%;margin-bottom:6px;">'
      +   '<input class="input-field" id="wisdomAddDesc" placeholder="适用时机（如：焦虑时、拖延时）" style="display:block;width:100%;">'
      + '</div>';
  }

  var catHtml = '';
  if (showCards.length === 0) {
    catHtml = '<div class="wisdom-empty">'+(wisdomViewMode==='archived' ? '存档区空空，不需要的卡片可以存档到这里' : '暂无在用心法卡片')+'</div>';
  } else {
    WISDOM_CATS.forEach(function(cat) {
      var catCards = showCards.filter(function(c) { return c.cat === cat; });
      if (catCards.length === 0) return;
      var catId = 'wisdomCat' + cat.replace(/[^a-zA-Z]/g,'');
      catHtml += '<div class="wisdom-cat-header" onclick="toggleWisdomCat(\''+catId+'\')">'
        + '<span class="wisdom-cat-name">'+(WISDOM_CAT_ICONS[cat]||'')+' '+cat+' ('+catCards.length+')</span>'
        + '<span style="font-size:12px;color:var(--muted);">展开 ▼</span>'
        + '</div>'
        + '<div class="wisdom-cat-body open" id="'+catId+'">'
        + catCards.map(function(c) {
          return '<div class="wisdom-card">'
            + '<div class="wisdom-card-scene">📌 '+escHtml(c.desc||'')+'</div>'
            + '<div class="wisdom-card-title">'+escHtml(c.method)+'</div>'
            + '<div class="wisdom-card-desc">'+escHtml(c.scene)+'</div>'
            + '<div class="wisdom-actions">'
            + (wisdomViewMode === 'active'
              ? '<button class="btn-sm" onclick="archiveWisdomCard(\''+c.id+'\')">📦 存档</button><button class="btn-sm" onclick="editWisdomCard(\''+c.id+'\')">✏️</button><button class="btn-sm danger" onclick="deleteWisdomCard(\''+c.id+'\')">删</button>'
              : '<button class="btn-sm primary" onclick="restoreWisdomCard(\''+c.id+'\')">↩️ 恢复</button><button class="btn-sm danger" onclick="deleteWisdomCard(\''+c.id+'\')">删</button>')
            + '</div>'
            + '</div>';
        }).join('')
        + '</div>';
    });
  }

  var footer = '<div style="text-align:center;padding:16px 0;color:var(--muted);font-size:12px;line-height:1.6;">'
    + '不用全部做到。每次遇到具体的事，挑一个最有感的试试就行。<br><strong>慢慢来，比较快。</strong>'
    + '</div>';

  return '<div class="section-title">💡 心法卡片</div>'
    + subToggle
    + addForm
    + catHtml
    + footer;
}

function setWisdomViewMode(m) { wisdomViewMode = m; renderPage('soul'); }
function toggleWisdomCat(catId) {
  var body = document.getElementById(catId);
  if (body) body.classList.toggle('open');
}
function addWisdomCard() {
  var cat = document.getElementById('wisdomAddCat');
  var method = document.getElementById('wisdomAddMethod');
  var scene = document.getElementById('wisdomAddScene');
  var desc = document.getElementById('wisdomAddDesc');
  if (!method || !method.value.trim()) { toast('请输入方法名称'); return; }
  if (!state.soul.wisdomCards) state.soul.wisdomCards = [];
  state.soul.wisdomCards.push({ id:'wc'+Date.now(), cat:cat.value, scene:scene.value.trim(), method:method.value.trim(), desc:desc.value.trim(), archived:false });
  saveData(); renderPage('soul'); toast('心法卡片已添加');
}
function archiveWisdomCard(id) {
  var c = (state.soul.wisdomCards||[]).find(function(x) { return x.id === id; });
  if (c) { c.archived = true; saveData(); renderPage('soul'); toast('已存档'); }
}
function restoreWisdomCard(id) {
  var c = (state.soul.wisdomCards||[]).find(function(x) { return x.id === id; });
  if (c) { c.archived = false; saveData(); renderPage('soul'); toast('已恢复'); }
}
function deleteWisdomCard(id) {
  state.soul.wisdomCards = (state.soul.wisdomCards||[]).filter(function(c) { return c.id !== id; });
  saveData(); renderPage('soul');
}
function editWisdomCard(id) {
  var c = (state.soul.wisdomCards||[]).find(function(x) { return x.id === id; });
  if (!c) return;
  var m = document.createElement('div');
  m.className = 'modal-overlay show'; m.id = 'editWisdomModal';
  m.innerHTML = '<div class="modal-box" style="max-width:400px;">'
    + '<h3>✏️ 编辑心法卡片</h3>'
    + '<select class="input-field" id="editWisdomCat" style="display:block;width:100%;margin-bottom:8px;">'
    + WISDOM_CATS.map(function(cat) { return '<option value="'+cat+'"'+(c.cat===cat?' selected':'')+'>'+(WISDOM_CAT_ICONS[cat]||'')+' '+cat+'</option>'; }).join('')
    + '</select>'
    + '<input class="input-field" id="editWisdomMethod" value="'+escHtml(c.method)+'" placeholder="方法名称" style="display:block;width:100%;margin-bottom:8px;">'
    + '<input class="input-field" id="editWisdomScene" value="'+escHtml(c.scene)+'" placeholder="场景说明" style="display:block;width:100%;margin-bottom:8px;">'
    + '<input class="input-field" id="editWisdomDesc" value="'+escHtml(c.desc)+'" placeholder="适用时机" style="display:block;width:100%;margin-bottom:8px;">'
    + '<div class="modal-actions">'
    + '<button class="btn-sm" onclick="document.getElementById(\'editWisdomModal\').remove()">取消</button>'
    + '<button class="btn-sm primary" onclick="saveEditWisdomCard(\''+id+'\')">保存</button>'
    + '</div></div>';
  document.body.appendChild(m);
  m.addEventListener('click', function(e) { if (e.target === m) m.remove(); });
  setTimeout(function() { var inp = document.getElementById('editWisdomMethod'); if (inp) { inp.focus(); inp.select(); } }, 50);
}
function saveEditWisdomCard(id) {
  var c = (state.soul.wisdomCards||[]).find(function(x) { return x.id === id; });
  if (!c) return;
  var method = document.getElementById('editWisdomMethod').value.trim();
  if (!method) { toast('方法名称不能为空'); return; }
  c.cat = document.getElementById('editWisdomCat').value;
  c.method = method;
  c.scene = document.getElementById('editWisdomScene').value.trim();
  c.desc = document.getElementById('editWisdomDesc').value.trim();
  saveData();
  document.getElementById('editWisdomModal').remove();
  renderPage('soul'); toast('卡片已更新');
}

let moodView = 'list';
let moodDetailId = null;
const MOOD_EMOJIS = ['','😞','😕','😐','🙂','😊'];
const MOOD_LABELS = ['','低落','不太好','一般','不错','很棒'];

function renderMood() {
  if (moodView === 'detail' && moodDetailId) return renderMoodDetail();
  return renderMoodList();
}

function renderMoodList() {
  var moods = (state.meditate.moods || []).slice().sort(function(a,b) { return (b.date||'').localeCompare(a.date||''); });

  // Simple mood trend
  var last7 = [];
  for (var i = 6; i >= 0; i--) {
    var d = new Date(); d.setDate(d.getDate() - i);
    var ds = fmtDate(d);
    var dayMoods = moods.filter(function(m) { return m.date === ds; });
    var avg = dayMoods.length ? Math.round(dayMoods.reduce(function(a,b){return a+b.level;},0)/dayMoods.length) : 0;
    last7.push({ date: ds.slice(5), avg: avg });
  }

  // Mood picker — opens modal instead of creating immediately
  var pickerHtml = '<div class="section-title">💭 记录情绪</div>'
    + '<div class="mood-picker">'
    + [1,2,3,4,5].map(function(l) {
        return '<button class="mood-option" onclick="showAddMood('+l+')" title="'+MOOD_LABELS[l]+'">'+MOOD_EMOJIS[l]+'</button>';
      }).join('')
    + '</div>';

  // Trend chart
  var trendHtml = '<div class="section-title">📈 近7天趋势</div>'
    + '<div class="chart-mini" style="height:80px;">'
    + last7.map(function(d) {
        return '<div class="bar" style="height:'+d.avg*16+'px;" title="'+d.date+': '+(d.avg>0?MOOD_EMOJIS[d.avg]:'无记录')+'"><div class="bar-label">'+d.date+'</div></div>';
      }).join('')
    + '</div>';

  // List — compact thumbnail cards
  var listHtml = '<div class="section-title">📋 情绪记录 (' + moods.length + ')</div>'
    + (moods.length === 0 ? '<div class="empty-state">点击上方表情开始记录~</div>' :
        moods.map(function(m) {
          var preview = '';
          if (m.source) preview = m.source;
          else if (m.note) { var lines = m.note.split('\n'); preview = lines[0]; }
          if (preview.length > 40) preview = preview.substring(0, 40) + '...';
          if (m.note && m.note.length > 40) preview += ' ›';
          var aiIcon = m.aiAdvice ? ' 🤖' : '';
          return '<div class="card lib-item-card" onclick="openMoodDetail(\''+m.id+'\')">'
            + '<div class="card-row">'
            +   '<span style="font-size:24px;flex-shrink:0;">'+MOOD_EMOJIS[m.level]+'</span>'
            +   '<span class="card-content" style="flex:1;min-width:0;">'
            +     '<strong>'+MOOD_LABELS[m.level]+'</strong>'+aiIcon
            +     (preview ? '<div style="font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escHtml(preview)+'</div>' : '')
            +     '<div style="font-size:11px;color:var(--muted);margin-top:2px;">'+(m.date||'')+'</div>'
            +   '</span>'
            + '</div>'
            + '</div>';
        }).join('')
      );

  return pickerHtml + trendHtml + listHtml;
}

function renderMoodDetail() {
  var m = (state.meditate.moods||[]).find(function(x) { return x.id === moodDetailId; });
  if (!m) { closeMoodDetail(); return ''; }

  return '<div class="page active">'
    + '<div class="detail-header">'
    +   '<button class="btn-sm" onclick="closeMoodDetail()">← 返回</button>'
    +   '<span style="flex:1;text-align:center;font-weight:600;">'+MOOD_EMOJIS[m.level]+' '+MOOD_LABELS[m.level]+'</span>'
    +   '<button class="btn-sm danger" onclick="if(confirm(\'确定删除？\')){state.meditate.moods=state.meditate.moods.filter(function(x){return x.id!==\''+m.id+'\';});saveData();closeMoodDetail();toast(\'已删除\');}">🗑</button>'
    + '</div>'

    // Mood level selector
    + '<div class="section-title">💭 情绪等级</div>'
    + '<div class="mood-picker" id="detMoodLevel" style="margin-bottom:14px;">'
    + [1,2,3,4,5].map(function(l) {
        return '<button class="mood-option'+(m.level===l?' active':'')+'" onclick="var p=this.parentElement;p.querySelectorAll(\'.mood-option\').forEach(function(b){b.classList.remove(\'active\')});this.classList.add(\'active\');autoSaveMoodDetail();" title="'+MOOD_LABELS[l]+'">'+MOOD_EMOJIS[l]+'</button>';
      }).join('')
    + '</div>'

    // Date
    + '<div class="section-title">📅 日期</div>'
    + '<input class="input-field" id="detMoodDate" type="date" value="'+escHtml(m.date||'')+'" style="display:block;width:100%;margin-bottom:14px;" onblur="autoSaveMoodDetail()">'

    // Source
    + '<div class="section-title">🎯 情绪来源</div>'
    + '<input class="input-field" id="detMoodSource" value="'+escHtml(m.source||'')+'" placeholder="什么触发的？" style="display:block;width:100%;margin-bottom:14px;" onblur="autoSaveMoodDetail()" onkeydown="if(event.key===\'Enter\')this.blur()">'

    // Note — large textarea
    + '<div class="section-title">📝 详细感受</div>'
    + '<textarea class="input-field" id="detMoodNote" placeholder="详细描述你的感受..." rows="6" style="display:block;width:100%;margin-bottom:14px;font-size:14px;line-height:1.7;min-height:120px;" onblur="autoSaveMoodDetail()">'+escHtml(m.note||'')+'</textarea>'

    // AI Advice — large textarea
    + '<div class="section-title">🤖 AI建议</div>'
    + '<textarea class="input-field" id="detMoodAiAdvice" placeholder="与AI沟通后的解决方案、建议..." rows="6" style="display:block;width:100%;margin-bottom:14px;font-size:14px;line-height:1.7;min-height:120px;background:var(--bg);" onblur="autoSaveMoodDetail()">'+escHtml(m.aiAdvice||'')+'</textarea>'

    + '</div>';
}

function showAddMood(level) {
  var div = document.createElement('div');
  div.className = 'modal-overlay show';
  div.id = 'addMoodModal';
  div.innerHTML = '<div class="modal-box" style="max-width:440px;">'
    + '<h3>'+MOOD_EMOJIS[level]+' 记录'+MOOD_LABELS[level]+'情绪</h3>'
    + '<div class="section-title" style="margin-top:10px;">🎯 情绪来源</div>'
    + '<input class="input-field" id="addMoodSource" placeholder="什么触发的？（如：工作压力、和家人聊天）" style="display:block;width:100%;margin-bottom:8px;" onkeydown="if(event.key===\'Enter\'){event.preventDefault();document.getElementById(\'addMoodNote\').focus();}">'
    + '<div class="section-title">📝 详细感受</div>'
    + '<textarea class="input-field" id="addMoodNote" placeholder="详细描述你的感受..." rows="4" style="display:block;width:100%;margin-bottom:8px;"></textarea>'
    + '<div class="modal-actions">'
    + '<button class="btn-sm" onclick="document.getElementById(\'addMoodModal\').remove()">取消</button>'
    + '<button class="btn-sm primary" onclick="addMoodFromModal('+level+')">保存</button>'
    + '</div>'
    + '</div>';
  document.body.appendChild(div);
  div.addEventListener('click', function(e) { if (e.target === div) div.remove(); });
  setTimeout(function() { var inp = document.getElementById('addMoodSource'); if (inp) inp.focus(); }, 50);
}

function addMoodFromModal(level) {
  var sourceEl = document.getElementById('addMoodSource');
  var noteEl = document.getElementById('addMoodNote');
  if (!state.meditate.moods) state.meditate.moods = [];
  var newId = 'm' + Date.now();
  state.meditate.moods.push({
    id: newId,
    date: today(),
    level: level,
    source: sourceEl ? sourceEl.value.trim() : '',
    note: noteEl ? noteEl.value.trim() : '',
    aiAdvice: ''
  });
  saveData();
  var m = document.getElementById('addMoodModal');
  if (m) m.remove();
  openMoodDetail(newId);
  toast('情绪已记录');
}

function openMoodDetail(id) { moodDetailId = id; moodView = 'detail'; renderPage('soul'); }
function closeMoodDetail() { autoSaveMoodDetail(); moodDetailId = null; moodView = 'list'; renderPage('soul'); }
function autoSaveMoodDetail() {
  if (moodView !== 'detail' || !moodDetailId) return;
  var m = (state.meditate.moods||[]).find(function(x) { return x.id === moodDetailId; });
  if (!m) return;
  var dEl = document.getElementById('detMoodDate');
  if (!dEl) return;
  m.date = dEl.value || today();
  var sEl = document.getElementById('detMoodSource');
  if (sEl) m.source = sEl.value.trim();
  var nEl = document.getElementById('detMoodNote');
  if (nEl) m.note = nEl.value;
  var aEl = document.getElementById('detMoodAiAdvice');
  if (aEl) m.aiAdvice = aEl.value;
  var activeBtn = document.querySelector('#detMoodLevel .mood-option.active');
  if (activeBtn) {
    var btns = document.querySelectorAll('#detMoodLevel .mood-option');
    m.level = Array.from(btns).indexOf(activeBtn) + 1;
  }
  saveData();
}

function deleteMood(id) {

function setMedPreset(min) {
  medTimerDuration = min * 60;
  medTimerRemain = medTimerDuration;
  medTimerRunning = false;
  if (medTimerInterval) { clearInterval(medTimerInterval); medTimerInterval = null; }
  renderPage('soul');
}
function medTimerToggle() {
  if (medTimerDuration === 0) { toast('请先选择时长'); return; }
  if (medTimerRunning) {
    medTimerRunning = false;
    if (medTimerInterval) { clearInterval(medTimerInterval); medTimerInterval = null; }
    renderPage('soul');
  } else {
    medTimerRunning = true;
    medTimerInterval = setInterval(function() {
      medTimerRemain--;
      if (medTimerRemain <= 0) {
        medTimerRemain = 0;
        medTimerRunning = false;
        clearInterval(medTimerInterval);
        medTimerInterval = null;
        // Record session
        if (!state.meditate.sessions) state.meditate.sessions = [];
        state.meditate.sessions.push({ id:'ms'+Date.now(), date:today(), duration: Math.round(medTimerDuration/60) });
        saveData();
        toast('冥想完成！已记录 '+Math.round(medTimerDuration/60)+' 分钟');
        medTimerRemain = medTimerDuration; // reset for next time
        soulSubView='meditate'; renderPage('soul');
      } else {
        // Update display without full re-render
        var disp = document.querySelector('.med-timer-display');
        if (disp) {
          var m = Math.floor(medTimerRemain / 60);
          var s = medTimerRemain % 60;
          disp.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
        }
        var fg = document.querySelector('.med-timer-fg');
        if (fg) {
          fg.style.strokeDashoffset = 283 * (1 - medTimerRemain / medTimerDuration);
        }
      }
    }, 1000);
    renderPage('soul');
  }
}
function medTimerReset() {
  medTimerRunning = false;
  if (medTimerInterval) { clearInterval(medTimerInterval); medTimerInterval = null; }
  medTimerRemain = medTimerDuration;
  renderPage('soul');
}

  state.meditate.sessions = state.meditate.sessions.filter(function(s) { return s.id !== id; });

}

}

// 9. BAR (能量站)

let barSubView = 'meal'; // 'meal' | 'drink' | 'sleep'
var MEAL_TYPES = state.bar.mealTypes || [
  { id:'breakfast', icon:'🌅', label:'早餐', isDefault:true },
  { id:'lunch', icon:'☀️', label:'午餐', isDefault:true },
  { id:'dinner', icon:'🌙', label:'晚餐', isDefault:true },
  { id:'snack', icon:'🍪', label:'加餐', isDefault:true }
];
if (!state.bar.mealTypes) { state.bar.mealTypes = MEAL_TYPES; }
var MEAL_SOURCES = state.bar.mealSources || ['外食','家食','外卖'];
if (!state.bar.mealSources) { state.bar.mealSources = MEAL_SOURCES; }
var DRINK_TYPES = state.bar.drinkTypes || ['胶囊咖啡','手冲咖啡','拿铁','美式','茶','果汁','其他'];
if (!state.bar.drinkTypes) { state.bar.drinkTypes = DRINK_TYPES; }

if (!state.closet.cats) { state.closet.cats = CLOSET_CATS; }
function closetCatIcon(cat) {
  var m = {'上装':'👕','下装':'👖','连衣裙':'👗','外套':'🧥','鞋子':'👠','配饰':'💍'};
  return m[cat] || '💍';
}
function mealTypeLabel(t) { var m = MEAL_TYPES.find(function(x){return x.id===t;}); return m ? m.label : '餐'; }
function mealTypeIcon(t) { var m = MEAL_TYPES.find(function(x){return x.id===t;}); return m ? m.icon : '🍽️'; }
function sourceIcon(s) { return s==='外食'?'🍽️':s==='家食'?'🏠':'📦'; }

function renderBar() {
  var mod = state.modules.find(function(m) { return m.id === 'bar'; });
  var toggleHtml = '<div class="journal-view-toggle" style="margin-bottom:14px;">'
    + '<button class="jvt-btn'+(barSubView==='meal'?' active':'')+'" onclick="setBarSubView(\'meal\')">🍽️ 餐食</button>'
    + '<button class="jvt-btn'+(barSubView==='drink'?' active':'')+'" onclick="setBarSubView(\'drink\')">☕ 饮品</button>'
    + '<button class="jvt-btn'+(barSubView==='sleep'?' active':'')+'" onclick="setBarSubView(\'sleep\')">😴 睡眠</button>'
    + '</div>';

  var contentHtml;
  if (barSubView === 'meal') contentHtml = renderBarMeals();
  else if (barSubView === 'drink') contentHtml = renderBarDrinks();
  else contentHtml = renderBarSleep();

  return '<div class="page active">'
    + '<div class="module-title">'
    +   mod.icon + ' <span class="editable-title" ondblclick="editModule(\'bar\')">'+mod.name+'</span>'
    +   '<button class="edit-icon-btn" onclick="editModule(\'bar\')" title="编辑">✏️</button>'
    + '</div>'
    + toggleHtml
    + contentHtml
    + '</div>';
}

function setBarSubView(v) { barSubView = v; renderPage('bar'); }

function renderBarMeals() {
  var meals = (state.bar.meals || []).slice().sort(function(a,b) { return b.date.localeCompare(a.date); });
  var todayStr = today();
  var todayMeals = meals.filter(function(m) { return m.date === todayStr; });

  // Group by date (last 14 days)
  var grouped = {};
  meals.slice(0, 60).forEach(function(m) {
    if (!grouped[m.date]) grouped[m.date] = [];
    grouped[m.date].push(m);
  });
  var dates = Object.keys(grouped).sort().reverse().slice(0, 14);

  var mealTypeOpts = MEAL_TYPES.map(function(t) {
    return '<option value="'+t.id+'">'+t.icon+' '+t.label+'</option>';
  }).join('');
  var sourceOpts = MEAL_SOURCES.map(function(s) {
    return '<option value="'+s+'">'+s+'</option>';
  }).join('');

  var listHtml = dates.length === 0
    ? '<div class="empty-state">还没有餐食记录，开始记录今天吃了什么吧~</div>'
    : dates.map(function(ds) {
        var dayMeals = grouped[ds].sort(function(a,b) {
          var order = ['breakfast','lunch','dinner','snack'];
          return order.indexOf(a.mealType) - order.indexOf(b.mealType);
        });
        var isToday = ds === todayStr;
        var d = new Date(ds);
        var weekdays = ['日','一','二','三','四','五','六'];
        var dateLabel = (d.getMonth()+1)+'/'+d.getDate()+' 周'+weekdays[d.getDay()];
        return '<div class="card" style="margin-bottom:8px;">'
          + '<div style="font-size:12px;font-weight:600;color:'+(isToday?'var(--accent)':'var(--muted)')+';margin-bottom:6px;border-bottom:1px dashed var(--rule);padding-bottom:4px;">'
          +   (isToday?'📌 ':'')+dateLabel
          + '</div>'
          + dayMeals.map(function(m) {
              return '<div class="card-row" style="padding:4px 0;">'
                + '<span style="font-size:16px;">'+mealTypeIcon(m.mealType)+'</span>'
                + '<span class="card-content" style="font-size:13px;">'
                +   '<strong>'+mealTypeLabel(m.mealType)+'</strong>'
                +   ' <span style="font-size:11px;color:var(--muted);background:var(--bg2);padding:1px 6px;border-radius:8px;">'+sourceIcon(m.source)+' '+m.source+'</span>'
                +   (m.content ? ' · '+escHtml(m.content) : '')
                +   (m.note ? ' · <span style="color:var(--muted);">'+escHtml(m.note)+'</span>' : '')
                + '</span>'
                + '<button class="btn-sm" onclick="editMeal(\''+m.id+'\')" style="font-size:10px;padding:2px 6px;">✏️</button>'
                + '<button class="btn-sm danger" onclick="deleteMeal(\''+m.id+'\')" style="font-size:10px;padding:2px 6px;">删</button>'
                + '</div>';
            }).join('')
          + '</div>';
      }).join('');

  // Stats
  var eatOut = meals.filter(function(m){return m.source==='外食';}).length;
  var homeCook = meals.filter(function(m){return m.source==='家食';}).length;
  var takeout = meals.filter(function(m){return m.source==='外卖';}).length;

  return '<div class="section-title">➕ 记录餐食</div>'
    + '<div class="form-row">'
    +   '<select class="input-field" id="mealType" style="flex:0.5;">'+mealTypeOpts+'</select>'
    +   '<select class="input-field" id="mealSource" style="flex:0.5;">'+sourceOpts+'</select>'
    +   '<input class="input-field" type="date" id="mealDate" value="'+todayStr+'" style="width:120px;flex-shrink:0;">'
    + '</div>'
    + '<div class="form-row">'
    +   '<input class="input-field" id="mealContent" placeholder="吃了什么（如：番茄炒蛋、米饭）" style="flex:1;">'
    +   '<input class="input-field" id="mealNote" placeholder="备注（可选）" style="flex:0.6;">'
    +   '<button class="btn-sm primary" onclick="addMeal()">+ 添加</button>'
    + '</div>'
    + '<div style="display:flex;gap:6px;margin-bottom:8px;">'
    +   '<button class="btn-sm" onclick="openCatManager({title:\'管理餐食类型\',statePath:\'bar.mealTypes\',format:\'object\',reRender:\'bar\',refs:[{dataPath:\'bar.meals\',field:\'mealType\'}]})" style="font-size:12px;">⚙️ 管理餐类</button>'
    +   '<button class="btn-sm" onclick="openCatManager({title:\'管理餐食来源\',statePath:\'bar.mealSources\',format:\'string\',reRender:\'bar\',refs:[{dataPath:\'bar.meals\',field:\'source\'}]})" style="font-size:12px;">⚙️ 管理来源</button>'
    + '</div>'
    + '<div class="section-title">📋 餐食记录</div>'
    + listHtml
    + '<div class="section-title">📊 饮食统计</div>'
    + '<div class="stats-row">'
    +   '<div class="stat-card"><div class="stat-val">'+meals.length+'</div><div class="stat-lbl">总记录</div></div>'
    +   '<div class="stat-card"><div class="stat-val" style="color:#e65100;">'+eatOut+'</div><div class="stat-lbl">🍽️外食</div></div>'
    +   '<div class="stat-card"><div class="stat-val" style="color:#4caf50;">'+homeCook+'</div><div class="stat-lbl">🏠家食</div></div>'
    +   '<div class="stat-card"><div class="stat-val" style="color:#2196f3;">'+takeout+'</div><div class="stat-lbl">📦外卖</div></div>'
    + '</div>';
}

function addMeal() {

  var contentInp = $('mealContent'), noteInp = $('mealNote');

}

function editMeal(id) {

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'life-workbench-backup-' + today() + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('数据已导出');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (confirm('导入将覆盖当前数据，确定继续？')) {
        // Preserve current module definitions (don't let old backup overwrite names/icons)
        var savedModules = state.modules;
        if (imported.modules) delete imported.modules;
        // Merge with defaults to fill in any missing fields
        state = deepMerge(DEFAULT_DATA, imported);
        // Restore current module definitions
        state.modules = savedModules;
        // Run migrations on imported data
        runMigrations();
        saveData();
        renderPage(currentPage);
        buildSidebar();
        toast('数据已导入');
      }
    } catch(err) {
      toast('导入失败：文件格式错误');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function resetToday() {
  if (confirm('确定要重置今日数据吗？这会清空今日的待办、复盘、情绪和打卡记录。')) {
    const ts = today();
    state.dashboard.checkins[ts] = false;
    state.dashboard.checkinStreak = Math.max(0, (state.dashboard.checkinStreak || 0) - 1);
    state.plan.todos = (state.plan.todos || []).filter(t => t.date !== ts);
    state.review.entries = (state.review.entries || []).filter(e => e.date !== ts);
    state.meditate.moods = (state.meditate.moods || []).filter(m => m.date !== ts);
    saveData();
    renderPage(currentPage);
    toast('今日数据已重置');
  }
}

function importPosturePlanV2() {
  if (state._postureImportedV2) return;
  if (!state.gym) state.gym = {};
  if (!state.gym.plans) state.gym.plans = [];
  if (!state.gym.resources) state.gym.resources = [];
  if (!state.gym.resourceTags) state.gym.resourceTags = [];
  if (!state.tips) state.tips = { items:[], tags:[] };
  if (!state.tips.items) state.tips.items = [];

  var ts = Date.now();
  var todayStr = today();

  // ── 0. 清理旧V1数据（如有）──
  // 保留旧打卡进度（前4个康复动作 + 前6个激活动作）
  var oldDailyProgress = {};
  var oldActivateProgress = {};
  (state.gym.plans || []).forEach(function(p) {
    if (p.name && p.name.indexOf('每日康复训练') === 0) {
      (p.items || []).forEach(function(item, idx) {
        if (item.done && idx < 4) oldDailyProgress[idx] = { doneDate: item.doneDate, syncedWorkoutId: item.syncedWorkoutId };
      });
    }
    if (p.name && p.name.indexOf('隔天激活训练') === 0) {
      (p.items || []).forEach(function(item, idx) {
        if (item.done && idx < 6) oldActivateProgress[idx] = { doneDate: item.doneDate, syncedWorkoutId: item.syncedWorkoutId };
      });
    }
  });
  // 删除旧的体态矫正课表
  state.gym.plans = (state.gym.plans || []).filter(function(p) {
    return !(p.id && (p.id.indexOf('posture-daily-') === 0 || p.id.indexOf('posture-activate-') === 0));
  });
  // 删除旧的体态矫正资源
  state.gym.resources = (state.gym.resources || []).filter(function(r) {

  // ── 8. 创建阶段1课表（7天循环，共14课时=2周）──
  function genStage1Items(totalDays) {
    var items = [];
    for (var i = 1; i <= totalDays; i++) {
      var mod = i % 7;
      var content, type;
      if (mod === 0) { content = 'D' + i + ' 基础日'; type = '体态矫正'; }
      else if (mod % 2 === 1) { content = 'D' + i + ' 激活日'; type = '力量训练'; }
      else { content = 'D' + i + ' 康复日'; type = '拉伸放松'; }
      items.push({
        session: i, content: content,
        done: false, doneDate: '', syncedWorkoutId: '',
        workoutType: type
      });
    }
    return items;
  }

  state.gym.plans.push({
    id: 'netcls-plan-stage1-' + ts,
    name: '阶段1：每日康复（7天循环）',
    totalSessions: 14,
    items: genStage1Items(14),
    completed: false
  });

  state._netClassPlanImportedV2 = true;
  saveData();
  console.log('[体态训练·网课适配版] 导入完成：阶段1课表(14课时) + 20个动作资源 + 12个拉伸动作 + 7个运动组(激活日/康复日/基础日)');
}

// ─── 理财书籍导入 ───
function importFinanceBooks() {
  if (state._financeBooksImported) return;
  if (!state.library) state.library = {};
  if (!state.library.items) state.library.items = [];
  if (!state.library.tags) state.library.tags = [];

  var books = [
    { title:'彼得·林奇的成功投资', subtitle:'彼得·林奇（Peter Lynch）', note:'用大白话讲股票，文科生友好，几乎不用数学。', tags:['投资','股票'] },
    { title:'手把手教你读财报', subtitle:'唐朝', note:'中国人写的，用A股真实财报举例。', tags:['投资','财报'] },
    { title:'打开量化投资的黑箱', subtitle:'里什·纳兰（Rishi K. Narang）', note:'量化入门，偏直觉不偏公式。', tags:['投资','量化'] }
  ];

  var existing = {};
  state.library.items.forEach(function(i) { existing[i.title] = true; });

  var added = 0;
  books.forEach(function(b, idx) {
    if (existing[b.title]) return;
    b.tags.forEach(function(t) {
      if (state.library.tags.indexOf(t) === -1) state.library.tags.push(t);
    });
    state.library.items.push({
      id:'libfb'+Date.now()+idx, title:b.title, type:'book', status:'wish', tags:b.tags,
      rating:null, note:b.note, subtitle:b.subtitle, year:'',
      link:'', startDate:'', endDate:'', progress:0, totalUnits:0, progressUnit:'page',
      excerpts:[], createdAt:today()
    });
    added++;
  });

  state._financeBooksImported = true;
  saveData();
  console.log('[理财书籍] 导入完成：新增 ' + added + ' 本书');
}

(function init() {
  migrateToDiary();
  importPosturePlanV3();
  importTrainingPlanV3();
  importFinanceStudyPlan();
  importTennisStretchPlan();
  importNetClassPlan();
  importFinanceBooks();
  initWisdomCards();
  // Migrate old resources: add category and createdAt
  var needMigrate = false;
  (state.gym.resources || []).forEach(function(r) {
    if (!r.category) { r.category = 'other'; needMigrate = true; }
    if (!r.createdAt) { r.createdAt = today(); needMigrate = true; }
  });
  if (needMigrate) saveData();
  buildSidebar();
  navigate('dashboard');
  updateClock();
  updateThemeButtons();
})();
</script>
